<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 182 32" width="182" height="32" role="img" aria-label="Website minhthanhvilla.com">
  <style>
    .label {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      fill: #f0f6fc;
    }
    @keyframes neonWeb {
      0%   { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .trail {
      fill: none;
      stroke: #2563EB;
      stroke-width: 3;
      stroke-opacity: 0.32;
      stroke-dasharray: 30 70;
      stroke-linecap: round;
      animation: neonWeb 3.2s linear infinite;
      animation-delay: -1s;
    }
    .core {
      fill: none;
      stroke: #38BDF8;
      stroke-width: 1.5;
      stroke-dasharray: 24 76;
      stroke-linecap: round;
      animation: neonWeb 3.2s linear infinite;
      animation-delay: -1s;
    }
  </style>
  <rect x="1" y="1" width="180" height="30" rx="15" fill="#161b22" stroke="#29313d" stroke-width="1.2" />
  <rect class="trail" x="1" y="1" width="180" height="30" rx="15" pathLength="100" />
  <rect class="core" x="1" y="1" width="180" height="30" rx="15" pathLength="100" />

  <!-- Globe Icon -->
  <g transform="translate(21, 16)">
    <circle r="7.2" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.2" />
    <ellipse rx="3.4" ry="7.2" fill="none" stroke="#93c5fd" stroke-width="1" />
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#93c5fd" stroke-width="1" />
  </g>

  <text x="36" y="20.5" class="label">minhthanhvilla.com</text>
</svg>
