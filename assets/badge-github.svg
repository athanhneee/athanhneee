      font-size: 12.5px;
      font-weight: 700;
      fill: #f0f6fc;
    }
    @keyframes neonGh {
      0%   { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .trail {
      fill: none;
      stroke: #8B5CF6;
      stroke-width: 3;
      stroke-opacity: 0.32;
      stroke-dasharray: 30 70;
      stroke-linecap: round;
      animation: neonGh 3.4s linear infinite;
      animation-delay: -2s;
    }
    .core {
      fill: none;
      stroke: #40C463;
      stroke-width: 1.5;
      stroke-dasharray: 24 76;
      stroke-linecap: round;
      animation: neonGh 3.4s linear infinite;
      animation-delay: -2s;
    }
