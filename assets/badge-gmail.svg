<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 32" width="100" height="32" role="img" aria-label="Gmail">
  <style>
    .label {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      fill: #f0f6fc;
    }
    @keyframes neonGmail {
      0%   { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .trail {
      fill: none;
      stroke: #EA4335;
      stroke-width: 3;
      stroke-opacity: 0.3;
      stroke-dasharray: 30 70;
      stroke-linecap: round;
      animation: neonGmail 3s linear infinite;
    }
    .core {
      fill: none;
      stroke: #ff6b6b;
      stroke-width: 1.5;
      stroke-dasharray: 24 76;
      stroke-linecap: round;
      animation: neonGmail 3s linear infinite;
    }
  </style>
  <rect x="1" y="1" width="98" height="30" rx="15" fill="#161b22" stroke="#29313d" stroke-width="1.2" />
  <rect class="trail" x="1" y="1" width="98" height="30" rx="15" pathLength="100" />
  <rect class="core" x="1" y="1" width="98" height="30" rx="15" pathLength="100" />

  <!-- Gmail Envelope Icon -->
  <rect x="13" y="9.5" width="16" height="13" rx="2.5" fill="#EA4335" />
  <path d="M14.5 11l6.5 5 6.5-5" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />

  <text x="36" y="20.5" class="label">Gmail</text>
</svg>
